spring:
  application:
    name: gestion-deudas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_deudas}
    username: ${DB_USER:gd_app}
    password: ${DB_PASSWORD}        # sin valor por defecto: nunca se versionan secretos
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # el esquema lo controla Flyway, no Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # evita mass assignment
    mapper:
      allow-coercion-of-scalars: false   # "100" (texto) NO se acepta como número

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

seguridad:
  bcrypt-strength: 12
  rate-limit:
    lectura-por-minuto: 120
    escritura-por-minuto: 30
  admin-inicial:                    # solo se usa si no existe ningún admin
    usuario: ${ADMIN_BOOTSTRAP_USER:}
    clave: ${ADMIN_BOOTSTRAP_PASSWORD:}
